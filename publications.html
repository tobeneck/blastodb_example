<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Publications — BlastoDB</title>
        <meta
            name="description"
            content="Browse peer-reviewed publications related to Blastocystis research, subtypes, and genomics."
        />
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <div id="nav-placeholder"></div>

        <div class="page-hero">
            <h1>Publications</h1>
            <p>
                Browse peer-reviewed publications related to Blastocystis
                research, subtypes, and genomics.
            </p>
        </div>

        <section class="section">
            <div class="pub-controls">
                <div class="pub-filter-group">
                    <label class="pub-filter-label" for="pub-filter-toggle"
                        >Select Tags</label
                    >
                    <div class="pub-filters" id="pub-filters"></div>
                </div>
                <div class="pub-count" id="pub-count" aria-live="polite"></div>
            </div>

            <div class="news-list pub-list" id="pub-list"></div>
            <div class="pub-empty" id="pub-empty" hidden>
                No publications match these tags yet.
            </div>
            <noscript>
                <div class="pub-empty">
                    Enable JavaScript to view the publications list.
                </div>
            </noscript>
        </section>

        <div id="footer-placeholder"></div>
        <script src="js/shared.js"></script>
        <script src="js/publications.js"></script>
    </body>
</html>
